schema_version: 1
scenario_id: NEW-BUSINESS-UNDERWRITING-EVOLUTION
title: "生命保険新契約査定システム 技術・組織進化シナリオ"
baseline_year: 1980
description: >-
  COBOLで構築された新契約査定システムが、商品追加、法改正、組織変更、
  Java/Springへの段階移行、外部連携、監査対応を経て複数世代併存構成となる履歴。

