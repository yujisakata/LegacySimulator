    operational_limits:
      - "チャネル別既定値をCOBOLが再解釈する"
      - "二つのスケジューラ間の完了連絡は運用監視に依存する"
    change_policy: "オンラインはSpringへ集約し、バッチ移行は個別案件で判断する"
    inherited_assets: ["COBOL契約原簿", "旧Java照会", "Spring XML設定", "商品別COBOL"]

