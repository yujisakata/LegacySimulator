schema_version: 1
profile_id: NEW-BUSINESS-TECH-EVOLUTION
description: "1980年のCOBOLからJava/Springへ段階移行する標準技術プロファイル"

versions:
  V1:
    scenario_year: 1980
    generation: mainframe_baseline
    architecture: "COBOLオンライン処理と夜間バッチを固定長ファイルで接続する単一メインフレーム構成"
    languages:
      primary: "ANSI COBOL相当"
      job_control: "JCL相当"
      prohibited: ["Java", "依存性注入フレームワーク", "ORM"]
    online:
      ui: "文字端末"
      transaction: "画面単位の手続き型COBOLプログラム"
    batch:
      scheduler: "JCLジョブネット"
      style: "順次読込、ソート、マッチング、固定長出力"
    data:
      system_of_record: "契約原簿ファイル"
      stores: ["索引編成ファイル", "順編成ファイル"]
      record_format: "固定長。COPY句でレコード定義を共有"
    integration: ["ファイル受渡し", "紙帳票"]
    build_deploy: "コンパイル、リンク、ロードモジュール配布を運用手順書に従い実施"
    testing: "代表データによるプログラム試験、ジョブ結合試験、結果帳票の目視確認"
    operational_limits:
      - "夜間バッチ枠内に処理を完了する"
      - "ファイルレイアウト変更は下流処理と同時調整する"
    change_policy: "設計、実装、テストを同期して更新する"
    inherited_assets: []

  V2:
    scenario_year: 1985
    generation: mainframe_extension
    architecture: "V1構成を維持し、特約判定を既存オンライン・バッチへ追加"
    languages:
      primary: "COBOL"
      job_control: "JCL相当"
      prohibited: ["Java", "レコード全面再設計"]
    online:
      ui: "文字端末に特約入力欄を追加"
      transaction: "既存プログラム内の特約フラグ分岐"
    batch:
      scheduler: "既存ジョブネットへ特約判定ステップを追加"
      style: "主契約レコードの未使用領域を特約コードとして解釈"
    data:
      system_of_record: "契約原簿ファイル"
      stores: ["索引編成ファイル", "順編成ファイル"]
      record_format: "V1固定長との下位互換を必須とする"
    integration: ["ファイル受渡し", "紙帳票"]
    build_deploy: "変更プログラム単位でロードモジュールを配布"
    testing: "修正箇所と主要な主契約・特約組合せを試験"
    operational_limits:
      - "証券発行バッチのレコード位置を変更しない"
      - "特約なしの既存データを再変換しない"
    change_policy: "既存構造への局所追加を優先する"
    inherited_assets: ["V1契約原簿", "V1ジョブネット", "V1帳票"]

  V3:
