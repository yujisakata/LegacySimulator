    architecture: "Spring受付・事務点検とCOBOL査定を夜間固定長ファイルで接続"
    languages:
      primary: "Java"
      secondary: "COBOL"
      framework: "Spring Framework世代。XMLによるDIとトランザクション設定を中心とする"
      prohibited: ["COBOL査定バッチの置換", "ファイル連携の無断変更"]
    online:
      ui: "サーバサイドHTMLのWeb受付"
      transaction: "Springサービスで受付、入力点検、状態管理"
    batch:
      scheduler: "Java受付締め処理とCOBOLジョブネットを時刻連携"
      style: "Java出力ファイルをCOBOLが取り込み、結果ファイルをJavaへ返却"
    data:
      system_of_record: "受付中はJava RDB、査定確定後はCOBOL契約原簿"
