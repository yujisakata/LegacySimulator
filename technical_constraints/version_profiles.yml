    generation: mainframe_temporal_rules
    architecture: "商品別COBOLに制度施行日別の新旧判定段落が併存"
    languages:
      primary: "COBOL"
      job_control: "JCL相当"
      prohibited: ["旧判定段落の削除", "システム日付だけによる過去契約判定"]
    online:
      ui: "旧告知項目と新告知項目を受付日条件で切替"
      transaction: "受付日、告知日、再告知フラグで判定段落を選択"
    batch:
      scheduler: "制度日前後のデータを同一ジョブで処理"
      style: "日付条件と例外フラグが複数段落へ分散"
    data:
      system_of_record: "契約原簿ファイル"
      stores: ["索引編成ファイル", "制度日マスタ", "順編成ファイル"]
      record_format: "新告知項目を予約領域へ格納"
    integration: ["ファイル受渡し", "紙帳票"]
    build_deploy: "施行日前にロードし、制度日マスタで有効化"
    testing: "施行日前、当日、施行日後、再告知の境界値試験"
    operational_limits:
      - "旧契約の再査定結果を再現する"
      - "制度判定に利用した日付を記録する"
    change_policy: "期限優先。旧処理を維持したまま新処理を追加する"
    inherited_assets: ["商品別COBOL", "差分設計書", "特約フラグ"]

  V5:
    scenario_year: 2000
    generation: cobol_with_java_query
    architecture: "COBOL中核に、参照専用Java Web照会システムを追加した二層構成"
    languages:
      primary: "COBOL"
      secondary: "当時のJava/Servlet/JDBC相当"
      prohibited: ["Javaから契約原簿を直接更新", "COBOL査定の同時移行"]
    online:
      ui: "COBOL文字端末とJava Web照会画面が併存"
      transaction: "更新はCOBOL、照会はJava"
    batch:
      scheduler: "COBOLジョブネットに照会DB複製処理を追加"
      style: "夜間に固定長ファイルからRDBへ変換"
    data:
      system_of_record: "COBOL契約原簿"
      stores: ["メインフレームファイル", "Java照会用RDB"]
      record_format: "固定長からRDB列へ一方向変換"
    integration: ["夜間ファイル転送", "文字コード変換"]
    build_deploy: "COBOLロードモジュールとJavaアプリケーションサーバを別々に配布"
    testing: "COBOL試験とJava画面試験を別チームで実施"
    operational_limits:
      - "Java照会値は前夜時点の場合がある"
      - "空白、ゼロ、NULLの変換規則を維持する"
    change_policy: "COBOL中核への変更を限定し、周辺からJava化する"
    inherited_assets: ["V1-V4 COBOL", "固定長ファイル", "商品別差分資料"]

