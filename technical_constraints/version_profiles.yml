    generation: mainframe_product_sprawl
    architecture: "商品別に複製されたCOBOLオンライン・査定バッチが共通ファイルを利用"
    languages:
      primary: "COBOL"
      job_control: "JCL相当"
      prohibited: ["商品共通基盤の新規構築", "全面回帰試験を伴う共通化"]
    online:
      ui: "商品別文字端末画面"
      transaction: "終身保険処理をコピーした商品別プログラム"
    batch:
      scheduler: "商品別分岐を追加した単一ジョブネット"
      style: "商品コードにより類似プログラムを呼び分ける"
    data:
      system_of_record: "商品共通の契約原簿ファイル"
      stores: ["索引編成ファイル", "順編成ファイル"]
      record_format: "商品別再定義を含む固定長レコード"
    integration: ["ファイル受渡し", "紙帳票"]
    build_deploy: "商品別ロードモジュールを個別配布"
    testing: "新商品を中心に試験し、既存商品は代表ケースのみ確認"
    operational_limits:
      - "コピー元とコピー先の共通判定を自動同期する仕組みはない"
      - "差分設計書を原本と併読する"
    change_policy: "商品別の影響局所化を優先する"
    inherited_assets: ["V1-V2契約原簿", "特約フラグ", "複製元COBOL"]

  V4:
